name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.8", "3.12"]
    env:
      TZ: MSK-3
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Тесты
        run: python -m unittest -v
      - name: Синтаксис
        run: python -m compileall -q src study install.py
      - name: Лаунчер
        run: python study --version
      - name: ruff
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: pipx run ruff check src tests study install.py
      - name: shellcheck
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: shellcheck -S warning setup.sh
