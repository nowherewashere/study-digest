name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.8", "3.12"]
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: python -m unittest -v
      - name: Syntax
        run: python -m compileall -q src skills study gitverse sourcecraft rutube labrelease install.py
      - name: Launchers
        run: |
          python study --version
          python gitverse --help
          python sourcecraft --help
          python rutube --help
          python labrelease --help
      - name: ruff
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: pipx run ruff check src skills tests study gitverse sourcecraft rutube labrelease install.py
      - name: shellcheck
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: shellcheck -S warning setup.sh
