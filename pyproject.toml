
[tool.ruff]
line-length = 100
target-version = "py38"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "N", "B", "UP", "SIM", "C4", "RUF", "PL", "A", "ARG", "RET", "PIE", "ISC", "PTH", "ERA", "S"]
ignore = [
    "RUF001", "RUF002", "RUF003",
    "ARG001",
    "PLR0913", "PLR0917",
    "PLR2004",
    "S310", "S603", "S607",
    "S105",
]

[tool.ruff.lint.per-file-ignores]
"src/study/courses.py" = ["T20"]
"src/study/cli.py" = ["T20"]
